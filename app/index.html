<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Everything comes from this host. No third-party scripts, so nothing else can read location.hash. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<title>SFF Den Map</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<header id="bar">
  <label class="den-pick">
    <span class="sr">Den</span>
    <select id="den" aria-label="Den"></select>
  </label>
  <div id="den-info"></div>
</header>

<div id="wrap">
  <svg id="map" role="img" aria-label="Den walking map" xmlns="http://www.w3.org/2000/svg">
    <g id="view"></g>
  </svg>
</div>

<div id="north" aria-hidden="true"><svg viewBox="0 0 24 34" width="24" height="34"><path d="M12 2 L20 16 L12 12 L4 16 Z" fill="#333"/><text x="12" y="31" text-anchor="middle">N</text></svg></div>
<div id="scale" aria-hidden="true"><div id="scale-bar"></div><span id="scale-text"></span></div>

<nav id="tools">
  <button id="fit" type="button">Whole den</button>
</nav>

<div id="msg" hidden></div>
</body>
</html>
