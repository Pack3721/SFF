<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" id="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Everything comes from this host. No third-party scripts, so nothing else can read location.hash. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<title>SFF 721 Map</title>
<!-- link previews (Messages, Facebook, email): tools/social-card/ has how the image is made -->
<meta name="description" content="Scouting for Food walking map for Pack 721: your den's segments, a GPS dot, and one-tap texts to the dispatcher.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SFF 721 Map">
<meta property="og:title" content="SFF 721 Map">
<meta property="og:description" content="Scouting for Food walking map for Pack 721: your den's segments, a GPS dot, and one-tap texts to the dispatcher.">
<meta property="og:url" content="https://pack3721.github.io/SFF/">
<meta property="og:image" content="https://pack3721.github.io/SFF/social-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The SFF 721 Map app on two phones: the Wolves map with target W2, and the Bears map with segment B4's card open.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icons/icon-192.png">
<!-- Add to Home Screen: opens full screen with its own icon. The web manifest is added by app.js on
     everything but iPhones: with one, iPhone saves the manifest's address and drops #tel=… -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SFF 721 Map">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="app.css?v=dev">
<script src="app.js?v=dev" defer></script>
</head>
<body>
<header id="bar">
  <label class="den-pick">
    <span class="sr">Den</span>
    <select id="den" aria-label="Den"></select>
  </label>
  <div id="den-info"></div>
  <button id="settings-btn" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><g fill="currentColor"><rect x="10.2" y="1" width="3.6" height="5" rx="1" transform="rotate(0 12 12)"/><rect x="10.2" y="1" width="3.6" height="5" rx="1" transform="rotate(45 12 12)"/><rect x="10.2" y="1" width="3.6" height="5" rx="1" transform="rotate(90 12 12)"/><rect x="10.2" y="1" width="3.6" height="5" rx="1" transform="rotate(135 12 12)"/><rect x="10.2" y="1" width="3.6" height="5" rx="1" transform="rotate(180 12 12)"/><rect x="10.2" y="1" width="3.6" height="5" rx="1" transform="rotate(225 12 12)"/><rect x="10.2" y="1" width="3.6" height="5" rx="1" transform="rotate(270 12 12)"/><rect x="10.2" y="1" width="3.6" height="5" rx="1" transform="rotate(315 12 12)"/><circle cx="12" cy="12" r="7.6"/></g><circle cx="12" cy="12" r="3.1" fill="#fff"/></svg></button>
</header>

<div id="wrap">
  <svg id="map" role="img" aria-label="Den walking map" xmlns="http://www.w3.org/2000/svg">
    <g id="view"></g>
  </svg>
  <svg id="fx" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <g id="fx-view"><path id="ants" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"/></g>
  </svg>
</div>

<div id="north" aria-hidden="true"><svg viewBox="0 0 24 34" width="24" height="34"><path d="M12 2 L20 16 L12 12 L4 16 Z" fill="#333"/><text x="12" y="31" text-anchor="middle">N</text></svg></div>
<div id="scale" aria-hidden="true"><div id="scale-bar"></div><span id="scale-text"></span><span id="build" title="Version"></span></div>

<button id="banner" type="button" hidden></button>

<button id="setup-status" type="button" hidden></button>

<div id="gps-status" role="status" hidden></div>
<button id="me-edge" type="button" aria-label="You're off the map here: tap to center on you" hidden></button>

<nav id="tools">
  <button id="me-btn" type="button" aria-pressed="false" aria-label="Center on me" title="Center on me">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 1.5v3.5M12 19v3.5M1.5 12H5M19 12h3.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>
  <button id="segs-btn" type="button" aria-label="Segments list" title="Segments list">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><g fill="currentColor"><circle cx="5" cy="6.5" r="1.8"/><circle cx="5" cy="12" r="1.8"/><circle cx="5" cy="17.5" r="1.8"/></g><path d="M9.5 6.5h11M9.5 12h11M9.5 17.5h11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>
</nav>

<section id="card" aria-label="Segment" hidden></section>
<section id="avail" aria-label="Text available" hidden></section>
<section id="leader" aria-label="Den leader" hidden></section>
<section id="gqr" aria-label="Group QR code" hidden></section>

<section id="sheet" aria-label="Segments" hidden>
  <header>
    <div class="tabs" role="tablist" aria-label="Segments">
      <button id="tab-all" type="button" role="tab">Segments</button>
      <button id="tab-mine" type="button" role="tab">Mine</button>
    </div>
    <button id="sheet-close" type="button" class="close" aria-label="Close">&#10005;</button>
  </header>
  <div id="sheet-body"></div>
</section>

<section id="settings" aria-label="Settings" hidden>
  <header><h2>Settings</h2><button id="settings-close" type="button" class="close" aria-label="Close">&#10005;</button></header>
  <div id="settings-body"></div>
</section>

<div id="msg" hidden></div>
</body>
</html>
