<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Everything comes from this host. No third-party scripts, so nothing else can read location.hash. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<title>SFF Den Map</title>
<link rel="icon" href="icons/icon-192.png">
<!-- Add to Home Screen: opens full screen with its own icon -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SFF Map">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="app.css?v=dev">
<script src="app.js?v=dev" defer></script>
</head>
<body>
<header id="bar">
  <label class="den-pick">
    <span class="sr">Den</span>
    <select id="den" aria-label="Den"></select>
  </label>
  <div id="den-info"></div>
</header>

<div id="wrap">
  <svg id="map" role="img" aria-label="Den walking map" xmlns="http://www.w3.org/2000/svg">
    <g id="view"></g>
  </svg>
</div>

<div id="north" aria-hidden="true"><svg viewBox="0 0 24 34" width="24" height="34"><path d="M12 2 L20 16 L12 12 L4 16 Z" fill="#333"/><text x="12" y="31" text-anchor="middle">N</text></svg></div>
<div id="scale" aria-hidden="true"><div id="scale-bar"></div><span id="scale-text"></span><span id="build" title="Version"></span></div>

<button id="banner" type="button" hidden></button>

<div id="gps-status" role="status" hidden></div>

<nav id="tools">
  <button id="me-btn" type="button" aria-pressed="false"><span aria-hidden="true">&#9673;</span> Centre on me</button>
  <button id="segs-btn" type="button">Segments</button>
  <button id="fit" type="button">Whole den</button>
</nav>

<section id="card" aria-label="Segment" hidden></section>

<section id="sheet" aria-labelledby="sheet-title" hidden>
  <header><h2 id="sheet-title">Segments</h2><button id="sheet-close" type="button" class="close" aria-label="Close">&#10005;</button></header>
  <div id="sheet-body"></div>
</section>

<div id="msg" hidden></div>
</body>
</html>
